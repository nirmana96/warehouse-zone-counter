[project]
name = "warehouse-zone-counter"
version = "0.1.0"
description = "Warehouse zone monitoring and counting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.175",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wzc"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
